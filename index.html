
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A mini Pokédex powered by PokéAPI.">
    <title>Mini Pokédex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Mini Pokédex</h1>
        <p>Discover your favorite Pokémon!</p>
    </header>

    <main>
        <!-- Pokémon Search -->
        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Find a Pokémon</h2>

            <form id="pokemon-form">
                <label for="pokemon-input">
                    Pokémon Name or Number
                </label>

                <input
                    type="text"
                    id="pokemon-input"
                    name="pokemon"
                    placeholder="e.g. pikachu or 25"
                    required
                >

                <button type="submit">Search</button>
            </form>
        </section>

        <!-- Pokémon Results -->
        <section aria-labelledby="results-heading">
            <h2 id="results-heading">Pokémon Information</h2>

            <div id="pokemon-result" aria-live="polite">
                <p>Search for a Pokémon to see its information!</p>
            </div>
        </section>

        <!-- Pokémon Trading Card -->
        <section aria-labelledby="card-heading">
            <h2 id="card-heading">Pokémon Trading Card</h2>

            <div id="pokemon-card" aria-live="polite">
                <p>Search for a Pokémon to see a trading card!</p>
            </div>
        </section>
 
        <!-- Random Pokémon -->
        <section aria-labelledby="random-heading">
            <h2 id="random-heading">Feeling Lucky?</h2>

            <button type="button" id="random-button">
                Surprise Me!
            </button>
        </section>
    </main>

    <footer>
        <p>
            Pokémon data provided by
         <a href="https://pokeapi.co/">PokéAPI</a>
         and trading card data by
         <a href="https://tcgdex.dev/">TCGdex</a>.
        </p>
    </footer>
</body>
</html>
